name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d8a90cc5db15c1b42b5af16c742 # v4.0.4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
